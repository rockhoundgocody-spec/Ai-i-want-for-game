# Type-check, targeted regression tests and production build. (There is no general test
# suite: `npm test` covers only the build key guard, the service worker and PWA shortcuts.)
# The build runs WITHOUT GEMINI_API_KEY on purpose: vite.config.ts refuses to
# produce a production bundle that would contain the key.

# Actions are pinned to commit SHAs (the trailing comment names the release), so CI only
# runs action code that was reviewed here. To update, move every pin to the same new release.
# The runner image is pinned to ubuntu-24.04 instead of ubuntu-latest, which GitHub starts moving
# to Ubuntu 26 on 2026-10-19. Move to ubuntu-26.04 on purpose, after a green run there.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-build:
    name: Type-check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Tests (key guard, service worker, PWA shortcuts)
        run: npm test

      - name: Production build
        run: npm run build

      - name: PWA files must be in the build output
        run: test -f dist/manifest.json && test -f dist/sw.js
