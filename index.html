    <style>
      :root { 
        --neon-cyan: #22d3ee; 
        --font-sans: 'Exo 2', sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
      html, body { 
        height: 100%; margin: 0; background: #030508; color: #f3f4f6; 
        font-family: var(--font-sans); 
        overflow: hidden; 
        /* Native feel improvements */
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior-y: none; /* Prevent bounce on body */
      }
      
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10000;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.02;
        /* Move animation to GPU */
        transform: translateZ(0); 
        animation: grain-flicker 1s steps(1) infinite;
      }

      /* Reduce motion preference */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      @keyframes grain-flicker {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-1%, -1%); }
        30% { transform: translate(1%, 1%); }
        50% { transform: translate(-1%, 1%); }
        70% { transform: translate(1%, -1%); }
      }

      .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
      ::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Hardware accelerated animations */
      .animate-hologram { animation: hologram-drift 5s ease-in-out infinite; will-change: transform; }
      @keyframes hologram-drift { 0%, 100% { transform: translateY(0) rotateX(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } }
      
      @keyframes scan-v { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
      
      @keyframes shimmer { 0% { transform: translateX(-100%) skewX(-30deg); } 100% { transform: translateX(200%) skewX(-30deg); } }
      .animate-shimmer { position: relative; overflow: hidden; }
      .animate-shimmer::before {
        content: '';
        position: absolute;
        top: 0; left: 0;
        width: 50%;
        height: 100%;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.1), transparent);
        animation: shimmer 4s infinite;
        will-change: transform;
      }

      .perspective-1000 { perspective: 1000px; }
      
      /* Active state for buttons to feel responsive */
      button:active { filter: brightness(0.9); transform: scale(0.98); transition: transform 0.1s; }
    </style>
